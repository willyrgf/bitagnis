defaults:
  # Explore below the target, hold between target and limit, and roll back
  # above the limit. The cutoff remains the emergency threshold.
  recoveryTemp: 61
  targetTemp: 65
  tempLimit: 66
  tempCutoff: 70

  # Board limits. New trials require 2 W and 10% VR-temperature headroom.
  maxPower: 24
  vrTempHigh: 97

  # Optional AxeOS ASIC error telemetry is a health constraint.
  maxErrorPercentage: 5

  # Each trial ramps for 60 seconds, then collects a five-minute window.
  metricsInterval: 10
  rampUpSeconds: 60
  evaluationWindowMinutes: 5

  # Repeated overheats multiply this cooldown, capped at 24 hours.
  overheatCooldownMinutes: 120

  # Mining reconciliation is inactive unless an effective hostname setting
  # explicitly enables it. Passwords are read from the named environment
  # variables only when a PATCH is required.
  mining:
    enabled: false
    primary:
      host: pool.example.net
      port: 3333
      user: worker-name
      passwordEnv: BITAGNIS_PRIMARY_STRATUM_PASSWORD
    fallback:
      host: fallback.example.net
      port: 3333
      user: worker-name
      passwordEnv: BITAGNIS_FALLBACK_STRATUM_PASSWORD

# Every value except metricsInterval can be overridden by hostname.
overrides:
  bitaxe-example:
    maxPower: 24
    mining:
      enabled: false
      primary:
        user: worker-bitaxe-example
      fallback:
        user: worker-bitaxe-example
