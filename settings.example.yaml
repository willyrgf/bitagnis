defaults:
  # Explore below the target, hold between target and limit, and roll back
  # above the limit. Host cutoff containment must remain at or below the
  # AxeOS v2.8.1 strict 75°C ASIC trip boundary.
  recoveryTemp: 61
  targetTemp: 65
  tempLimit: 66
  tempCutoff: 70

  # Board limits. New trials require 2 W and 10% VR-temperature headroom.
  # vrTempHigh must remain at or below the strict 105°C firmware trip boundary.
  maxPower: 24
  vrTempHigh: 97

  # Optional AxeOS ASIC error telemetry is a health constraint.
  maxErrorPercentage: 5

  # Ramp and evaluation-window duration are inputs to durable sample counts,
  # not deadlines: a trial ramps for roughly 60 seconds' worth of consecutive
  # settled samples, then collects roughly a five-minute window's worth of
  # admitted samples. A slow or lossy poll cycle takes longer instead of
  # failing; a process restart resumes against whatever it already collected.
  metricsInterval: 10
  rampUpSeconds: 60
  evaluationWindowMinutes: 5

  # Set enabled here to apply mining settings to every selected miner, or
  # override it per hostname. Passwords are read from the named .env entries
  # only when a PATCH is required.
  mining:
    enabled: false
    primary:
      host: pool.example.net
      port: 3333
      user: worker-name
      passwordEnv: BITAGNIS_PRIMARY_STRATUM_PASSWORD
    fallback:
      host: fallback.example.net
      port: 3333
      user: worker-name
      passwordEnv: BITAGNIS_FALLBACK_STRATUM_PASSWORD

# Every value except metricsInterval can be overridden by hostname.
overrides:
  bitaxe-example:
    maxPower: 24
    mining:
      enabled: false
      primary:
        user: worker-bitaxe-example
      fallback:
        user: worker-bitaxe-example
